<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Brayan León</title>
  <desc id="d">Desarrollador Full Stack con enfoque backend. Disponible para prácticas profesionales 2027-1.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l, .c, .a, .f, .dot { animation-fill-mode: both; }
    .l   { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    .c   { transform-box: fill-box; transform-origin: center; animation: pop 1s cubic-bezier(.2,.7,.2,1) both; }
    .a   { transform-box: fill-box; transform-origin: left center; animation: draw .7s ease-out 1.15s both; }
    .f   { animation: fade .8s ease-out 1.1s both; }
    .f2  { animation: fade .8s ease-out 1.4s both; }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-in-out 2.2s infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
    @keyframes pop   { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
    @keyframes draw  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.6); } }
    @media (prefers-reduced-motion: reduce) { .l, .c, .a, .f, .f2, .dot { animation: none !important; } }
  </style>
